<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChildTube</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tv.css">
</head>
<body>
<div id="pair" class="hidden">
  <div class="logo"><span class="logo-play"></span>ChildTube</div>
  <h1>Ghép TV với điện thoại của bố mẹ</h1>
  <ol>
    <li>Trên điện thoại mở <span id="pair-url"></span></li>
    <li>Đăng nhập → <b>Cài đặt</b> → <b>Ghép TV mới</b> → nhập mã:</li>
  </ol>
  <div id="pair-code">······</div>
  <div id="pair-msg"></div>
</div>

<div id="home" class="hidden">
  <aside id="side">
    <div class="logo"><span class="logo-play"></span>ChildTube</div>
    <div id="channels"></div>
  </aside>
  <main id="main">
    <h1 id="ch-title"></h1>
    <div id="grid"></div>
    <div id="empty" class="hidden"></div>
  </main>
</div>

<div id="player" class="hidden">
  <div id="yt"></div>
  <div id="shield"></div>
  <div id="pause-icon" class="hidden"></div>
  <div id="osd">
    <button id="osd-back" type="button">‹ Quay lại</button>
    <div id="osd-title"></div>
    <div id="osd-bar"><div id="osd-fill"></div></div>
    <div id="osd-time"></div>
  </div>
</div>

<div id="pin" class="modal hidden">
  <div class="box">
    <h2>Dành cho bố mẹ</h2>
    <p>Nhập mã PIN</p>
    <div id="pin-dots"></div>
    <div id="pin-msg"></div>
    <div id="pin-pad"></div>
  </div>
</div>

<div id="parent" class="modal hidden">
  <div class="box">
    <h2>Bố mẹ</h2>
    <p>Thêm/bớt video bằng app ChildTube trên điện thoại:</p>
    <div id="admin-url"></div>
    <div id="parent-btns">
      <button class="pbtn" data-act="refresh">Tải lại danh sách</button>
      <button class="pbtn" data-act="exit">Thoát ứng dụng</button>
      <button class="pbtn" data-act="close">Đóng</button>
    </div>
    <div id="parent-msg"></div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="../config.js"></script>
<script src="tv.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
