<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChildTube</title>
<meta name="description" content="Chọn video YouTube cho bé xem trên TV">
<meta name="theme-color" content="#101a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChildTube">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo"></span>ChildTube</div>
  <div class="fam" id="fam-name"></div>
</header>

<!-- Đăng nhập -->
<section id="login" class="screen hidden">
  <div class="login-card">
    <h1>Chào bố mẹ 👋</h1>
    <p>Đăng nhập để chọn video cho bé xem trên TV.</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" inputmode="email" placeholder="ban@gmail.com" required>
      <label for="password">Mật khẩu</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="Ít nhất 6 ký tự" required>
      <button class="btn primary" type="submit" id="login-btn">Đăng nhập</button>
      <button class="btn link" type="button" id="mode-btn">Chưa có tài khoản? Tạo tài khoản mới</button>
    </form>
    <p class="msg" id="login-msg"></p>
  </div>
</section>

<!-- App -->
<main id="main" class="screen hidden">
  <div id="view"></div>
</main>

<nav id="tabs" class="tabs hidden">
  <button data-tab="list" class="on"><span>📺</span>Danh sách</button>
  <button data-tab="groups"><span>🗂️</span>Nhóm</button>
  <button data-tab="favs"><span>❤️</span>Yêu thích</button>
  <button data-tab="settings"><span>⚙️</span>Cài đặt</button>
</nav>

<div id="sheet" class="sheet hidden"><div class="sheet-box"><div class="sheet-grip"></div><div id="sheet-body"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script src="app.js"></script>
</body>
</html>
